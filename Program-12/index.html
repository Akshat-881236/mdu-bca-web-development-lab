<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Search & Filter Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1>🔍 Academic Course &amp; Library Search Engine</h1>
        <p>Real-Time Dynamic Filtering with Debouncing &amp; Substring Highlighting</p>
    </header>

    <main class="container">
        <!-- Search & Filter Controls -->
        <section class="card controls-card">
            <div class="search-bar-row">
                <div class="search-input-wrap">
                    <span class="search-icon">🔎</span>
                    <input type="text" id="searchInput" placeholder="Search by title, subject, instructor, or keyword..." autocomplete="off" aria-label="Search catalog">
                    <button id="clearSearchBtn" class="clear-btn hidden" aria-label="Clear search input">&times;</button>
                </div>
            </div>

            <div class="filters-row">
                <div class="filter-item">
                    <label for="deptFilter">Department:</label>
                    <select id="deptFilter">
                        <option value="All">All Departments</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Tech">Information Technology</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Management">Management (BBA/MBA)</option>
                    </select>
                </div>

                <div class="filter-item">
                    <label for="levelFilter">Level:</label>
                    <select id="levelFilter">
                        <option value="All">All Levels</option>
                        <option value="Undergraduate">Undergraduate (BCA)</option>
                        <option value="Postgraduate">Postgraduate (MCA)</option>
                    </select>
                </div>

                <div class="filter-item">
                    <label for="sortBy">Sort By:</label>
                    <select id="sortBy">
                        <option value="relevance">Relevance</option>
                        <option value="titleAsc">Title (A - Z)</option>
                        <option value="ratingDesc">Highest Rating</option>
                        <option value="yearDesc">Newest Edition</option>
                    </select>
                </div>
            </div>

            <!-- Suggested Quick Search Chips -->
            <div class="suggested-chips">
                <span class="chip-label">Quick Search:</span>
                <button class="chip" data-query="JavaScript">JavaScript</button>
                <button class="chip" data-query="Database">Database</button>
                <button class="chip" data-query="Algorithm">Algorithms</button>
                <button class="chip" data-query="React">React</button>
                <button class="chip" data-query="Python">Python</button>
            </div>
        </section>

        <!-- Search Status Bar -->
        <div class="search-status-bar">
            <span id="resultsCount">Showing all items</span>
            <span id="searchLatency" class="latency-badge">⚡ Instant Filter</span>
        </div>

        <!-- Results Grid -->
        <section id="resultsGrid" class="results-grid" aria-live="polite"></section>
    </main>

    <footer class="app-footer">
        <p>MDU Rohtak BCA Lab Assignment | Program 12 &copy; Web Application Development</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
