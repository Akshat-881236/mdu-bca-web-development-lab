<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blogging Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Blog</h1>
        <nav>
            <button data-page="home">Home</button>
            <button data-page="add">Add Post</button>
        </nav>
    </header>
    <main class="container">
        <!-- Home Page -->
        <section id="homePage" class="page">
            <div class="section-header">
                <h2>Blog Posts</h2>
                <button class="primary-btn" data-page="add">
                    Create Post
                </button>
            </div>
            <div id="postsContainer"></div>
        </section>
        <!-- Add/Edit Page -->
        <section id="formPage" class="page hidden">
            <div class="form-card">
                <h2 id="formHeading">Create Blog Post</h2>
                <form id="postForm">
                    <label for="title">Post Title</label>
                    <input type="text" id="title" maxlength="150" required placeholder="Enter post title">
                    <label for="author">Author Name</label>
                    <input type="text" id="author" maxlength="100" required placeholder="Enter author name">
                    <label for="content">Post Content</label>
                    <textarea id="content" rows="8" required placeholder="Write your blog post..."></textarea>
                    <div class="form-actions">
                        <button type="submit" class="primary-btn">
                            Save Post
                        </button>
                        <button type="button" id="cancelButton" class="secondary-btn">
                            Cancel
                        </button>
                    </div>
                </form>
                <p id="message" role="status"></p>
            </div>
        </section>
    </main>
    <footer>
        <p>My Blog Website | Local Storage Based</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
